name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master

jobs:
  install-default-with-presets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # see https://github.com/projectM-visualizer/projectm/blob/master/docs/building.rst#quick-start-debian--ubuntu
          backend_dependencies=(
            libgl1-mesa-dev
          )
          # see https://github.com/projectM-visualizer/frontend-sdl-cpp#building-from-source
          frontend_dependencies=(
            libsdl2-dev \
            libpoco-dev \
            libfreetype-dev
          )
          sudo apt-get install -y \
            "${backend_dependencies[@]}" \
            "${frontend_dependencies[@]}"

      - name: Run installer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./install.sh
          ./install.sh --prefix "$PWD/install-test" --with-presets

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: projectm-install
          path: ${{ github.workspace }}/install-test
          if-no-files-found: error
